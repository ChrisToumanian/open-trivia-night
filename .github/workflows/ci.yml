name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install HTMLHint
        run: npm install --no-save htmlhint@latest
      - name: HTML lint
        run: npx htmlhint "frontend/**/*.html"
      - name: JavaScript syntax checks
        run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install API dependencies
        run: npm ci
      - name: Session integration and migration tests
        run: npm test
